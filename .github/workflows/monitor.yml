name: Production monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: production-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-test.txt
      - name: Check production
        id: monitor
        run: python scripts/monitor_production.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-monitor-${{ github.run_id }}
          path: reports/production-check.json
          retention-days: 90
      - name: Open an incident or resolve it after recovery
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.monitor.outcome }}
        with:
          script: |
            const title = 'Production monitoring: service check failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100
            });
            const incident = issues.find(issue => issue.title === title && !issue.pull_request);
            const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.CHECK_OUTCOME !== 'success' && !incident) {
              await github.rest.issues.create({...context.repo, title,
                body: `Production readiness or smoke checks failed. Inspect [the run and saved report](${link}). No automatic rollback was attempted.`});
            } else if (process.env.CHECK_OUTCOME === 'success' && incident) {
              await github.rest.issues.createComment({...context.repo, issue_number: incident.number,
                body: `Production checks recovered: [successful run](${link}).`});
              await github.rest.issues.update({...context.repo, issue_number: incident.number, state: 'closed'});
            }
