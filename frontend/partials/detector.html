<!-- DETECTOR PAGE -->
<section id="detector" class="page">
  <div class="detector-container">
    <div class="detector-layout">
      <div class="detector-main">
        <div class="detector-card scan-card">
          <div class="scan-heading"><div><h2>Brain Tumor Analysis</h2><p>Upload an MRI scan to get started.</p></div><span id="status" class="status-badge">Ready</span></div>
          <div class="input-section">
            <input type="file" id="file" accept="image/*" aria-label="Choose MRI scan">
            <button id="predictBtn">Analyze scan</button>
          </div>
          <div class="preview-header"><div class="preview-title">MRI scan</div><button id="heatmapBtn" class="btn-secondary heatmap-btn hidden" type="button">Show heatmap</button></div>
          <div class="preview-grid"><div class="media-frame">
            <span class="scan-empty">Your MRI preview will appear here</span>
            <img id="preview" class="hidden" alt="Original MRI scan">
            <img id="heatmap" class="hidden heatmap-image" alt="Grad-CAM model influence overlay">
          </div></div>
          <div class="heatmap-legend" id="heatmapLegend" hidden>Lower influence <span aria-hidden="true"></span> Higher influence</div>
          <p class="heatmap-note">For reference only. Consult a medical professional.</p>
        </div>
      </div>
      <aside class="detector-raw">
        <div id="result" class="detector-card result-placeholder result-card">Results will appear after analysis.</div>
        <div class="detector-card chat-card">
          <div class="chat-title">Ask NeuroDetect</div>
          <div class="chat-messages" id="detectorChatMessages" aria-live="polite"></div>
          <div class="chat-input-row">
            <input id="detectorChatInput" type="text" aria-label="Ask NeuroDetect" placeholder="Ask about your results" autocomplete="off">
            <button class="chat-send" id="detectorChatSendBtn" type="button">Send</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
</section>
