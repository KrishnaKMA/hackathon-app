services:
  - type: web
    name: neurodetect-api
    runtime: python
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MODEL_BACKEND
        value: tflite
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: INFERENCE_MODE
        value: compiled
      - key: ALLOWED_ORIGINS
        value: https://frontend-4s5x.onrender.com,http://localhost:5500,http://127.0.0.1:5500
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_MB
        value: '10'
